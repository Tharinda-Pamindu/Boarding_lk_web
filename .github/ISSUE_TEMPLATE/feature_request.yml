name: ✨ Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve boarding.lk! Please search [existing issues](https://github.com/Tharinda-Pamindu/Boarding_lk_web/issues) first to see if your idea has already been suggested.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? Who is affected?
      placeholder: As a student, it's hard to find boardings that are close to a specific bus route...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen.
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who benefits from this?
      multiple: true
      options:
        - Students / tenants
        - Landlords / property owners
        - Admins / moderators
        - Developers / contributors
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search & filters
        - Listings
        - Post an ad
        - Accounts (login / register)
        - Saved listings
        - Guides & safety
        - Support
        - Localization (Sinhala / Tamil / English)
        - Accessibility
        - Performance / SEO
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any other solutions or workarounds?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, or links to similar features elsewhere.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this feature myself.
