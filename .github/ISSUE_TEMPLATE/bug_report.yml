name: 🐞 Bug report
description: Report something that is broken or not working as expected
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](https://github.com/Tharinda-Pamindu/Boarding_lk_web/issues) first to avoid duplicates.

        ⚠️ **Security vulnerabilities** must be reported privately. See [SECURITY.md](https://github.com/Tharinda-Pamindu/Boarding_lk_web/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: The search button does nothing when I select a campus quick filter...
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Affected page / URL
      description: Which page or route is affected?
      placeholder: e.g. /search, /post-ad, home page
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages from the browser console.
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device type
      options:
        - Mobile
        - Tablet
        - Desktop / Laptop
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 128 on Android 14, Safari on iOS 17
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Live demo (boardinglk.lovable.app)
        - Local development (npm run dev)
        - Production build (npm run preview)
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / recordings
      description: Drag and drop images or videos here, if applicable.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help us understand the issue.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I agree to follow this project's [Code of Conduct](https://github.com/Tharinda-Pamindu/Boarding_lk_web/blob/main/CODE_OF_CONDUCT.md).
          required: true
